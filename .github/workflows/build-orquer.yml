name: Build Orquer Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          targets: x86_64-pc-windows-msvc

      - name: Install Zig
        uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Remove Zig caches
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Build Orquer
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = "dist-windows"
          New-Item -ItemType Directory -Path $outDir -Force
          Copy-Item target\x86_64-pc-windows-msvc\release\orquer.exe $outDir\
          Copy-Item target\x86_64-pc-windows-msvc\release\orquer-msg.exe $outDir\
          Compress-Archive -Path "$outDir\*" -DestinationPath "orquer-windows-x86_64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orquer-windows-x86_64
          path: orquer-windows-x86_64.zip
          retention-days: 14
